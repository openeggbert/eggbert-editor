# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    # Task branches too, so that work is checked on hosted runners (and on
    # Windows and macOS at all) before anyone opens a pull request.
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-ci --parallel

      # Asset-free: unit tests, offscreen UI tests, the program's own smoke
      # test and the same smoke test from an installed tree. The local-sample
      # check is skipped because no world files are available here.
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: Package
        run: cd build-ci && cpack -G "TGZ;DEB"

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev

      - name: Configure with address and undefined-behavior sanitizers
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DEGGBERT_SANITIZE=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  # Windows and macOS: configure, build, test and package (a ZIP and a disk
  # image that carry Qt along). First green on hosted runners on 2026-11-23.
  windows:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc --parallel

      - name: Test
        run: ctest --preset windows-msvc --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package (ZIP with Qt alongside)
        run: cpack --config build-windows/CPackConfig.cmake -C Release -B build-windows/packages

  macos:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # Qt's own build: its deployment tool cannot gather a Homebrew Qt
      # (it timed out resolving that layout's frameworks). Not 6.5 or 6.8:
      # those link the AGL framework, which current macOS SDKs no longer
      # have (the linker stopped with "framework 'AGL' not found").
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: cmake --build --preset macos --parallel

      - name: Test
        run: ctest --preset macos --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package (disk image)
        run: cpack --config build-macos/CPackConfig.cmake -B build-macos/packages
