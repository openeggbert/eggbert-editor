# SPDX-License-Identifier: GPL-3.0-only
name: Linux CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-ci --parallel

      # Asset-free: unit tests, offscreen UI tests, the program's own smoke
      # test and the same smoke test from an installed tree. The local-sample
      # check is skipped because no world files are available here.
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: Package
        run: cd build-ci && cpack -G "TGZ;DEB"

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev

      - name: Configure with address and undefined-behavior sanitizers
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DEGGBERT_SANITIZE=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  # The two jobs below configure, build and test on Windows and macOS. They
  # have never run: the project was developed where only Linux is available
  # and no hosted run has happened yet. Until one has, they are allowed to
  # fail without failing the workflow, and no package for these platforms is
  # claimed to work (see NEXT.md).
  windows-untested:
    runs-on: windows-2022
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc --parallel

      - name: Test
        run: ctest --preset windows-msvc --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package (ZIP with Qt alongside; never run by the project)
        run: cpack --config build-windows/CPackConfig.cmake -C Release -B build-windows/packages

  macos-untested:
    runs-on: macos-14
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt and Ninja
        run: brew install qt ninja

      - name: Configure
        run: cmake --preset macos -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build --preset macos --parallel

      - name: Test
        run: ctest --preset macos --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package (disk image; never run by the project)
        run: cpack --config build-macos/CPackConfig.cmake -B build-macos/packages
